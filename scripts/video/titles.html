<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body.card { background: radial-gradient(120% 90% at 30% 20%, #1f4f6e 0%, #0f2a3d 55%, #0a1c29 100%); color: #fff; }
  body.light { background: radial-gradient(120% 100% at 20% 10%, #fffaf2 0%, #f3ebdd 70%, #eadfcd 100%); color: #1d1d1f; }
  body.overlay { background: transparent; }
  .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .big { font-size: 88px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; }
  .mid { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; color: rgba(255,255,255,.78); margin-top: 22px; }
  .light .mid { color: #55514a; }
  .small { font-size: 18px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #e9b27a; margin-top: 34px; }
  .light .small { color: #b0552f; }
  .anim { opacity: 0; will-change: transform, opacity; }
  .sun { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #ffe08a, #f6b73c 70%); box-shadow: 0 0 60px rgba(246,183,60,.55); margin: 0 auto 28px; }
  .rule { width: 64px; height: 3px; background: #e9b27a; margin: 28px auto 0; border-radius: 2px; }
  /* overlays */
  .chip { position: absolute; left: 32px; top: 28px; padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.88); color: #1d1d1f; font-size: 17px; font-weight: 650; letter-spacing: .02em; backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .chip b { color: #b0552f; font-weight: 700; margin-right: 8px; }
  .badge { position: absolute; right: 32px; top: 28px; padding: 9px 14px; border-radius: 10px; background: rgba(17,24,32,.72); color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .cap { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: 1000px; padding: 14px 26px; border-radius: 16px; background: rgba(17,24,32,.74); color: #fff; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; text-align: center; white-space: nowrap; }
  .place { position: absolute; left: 40px; bottom: 36px; color: #fff; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  .place small { display: block; font-size: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; opacity: .9; margin-top: 4px; }
  .end-grid { display: grid; gap: 14px; margin-top: 34px; font-size: 24px; font-weight: 500; color: #3a3833; }
  .url { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; color: #b0552f; margin-top: 18px; }
  .foot { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 16px; color: #7a746a; }
</style>
</head>
<body>
<script>
// Scenes are drawn as a function of the page clock (performance.now), which the capture script steps
// one frame at a time; one element moves at a time with a soft spring-like ease.
const q = new URLSearchParams(location.search);
const scene = q.get('scene');
const S = {
  same: {cls: 'card', html: `<div class="center"><div><div class="sun anim" data-in="0.1"></div><div class="big anim" data-in="0.35">Same sun.</div></div></div>`},
  skies: {cls: 'card', html: `<div class="center"><div><div class="big anim" data-in="0.1">Different skies.</div><div class="mid anim" data-in="0.6">Manila · Bangkok · Hanoi · Kuala Lumpur · Jakarta · Singapore</div></div></div>`},
  vr: {cls: 'card', html: `<div class="center"><div><div class="big anim" data-in="0.1">Now, in the headset.</div><div class="mid anim" data-in="0.6">Seated · hands or Touch controllers · no walking</div><div class="small anim" data-in="1.1">Headset view captured in Meta's IWER emulator</div></div></div>`},
  proof: {cls: 'card', html: `<div class="center"><div><div class="big anim" data-in="0.1" style="font-size:76px">18 levels. 6 capitals.</div><div class="mid anim" data-in="0.6">Every level proven solvable by the same code the game runs.</div><div class="mid anim" data-in="1.1">Sun paths are real for each city. Fewer pieces, more stars.</div></div></div>`},
  entry: {cls: 'card', html: `<div class="center"><div><div class="small anim" data-in="0.1" style="margin:0 0 26px">Our entry</div><div class="big anim" data-in="0.35" style="font-size:64px">Meta VR Start<br>Developer Competition 2026</div><div class="mid anim" data-in="1.0">VaLora: Two Watchers · a seated WebXR puzzle for Meta Quest</div></div></div>`},
  goal: {cls: 'card', html: `<div class="center"><div><div class="sun anim" data-in="0.05"></div><div class="big anim" data-in="0.3" style="font-size:70px">Let the sun in.<br>Keep the watchers out.</div><div class="mid anim" data-in="1.0">One player. Two watchers: the sun, and whoever looks in.</div><div class="small anim" data-in="1.5">Single player · seated · about two minutes a level</div></div></div>`},
  profile: {cls: 'light', html: `<div class="center"><div><div class="small anim" data-in="0.1" style="margin:0 0 18px">Made by</div><div class="big anim" data-in="0.35" style="font-size:80px">Aljabri Alam</div><div class="mid anim" data-in="0.8">Technical Lead · Singapore</div><div class="url anim" data-in="1.2" style="font-size:36px">github.com/aljabrialam</div></div></div><div class="foot anim" data-in="1.6">Entry · Meta VR Start Developer Competition 2026</div>`},
  watch: {cls: 'card', html: `<div class="center"><div><div class="big anim" data-in="0.1">Someone is always watching.</div></div></div>`},
  logo: {cls: 'card', html: `<div class="center"><div><div class="sun anim" data-in="0.05"></div><div class="big anim" data-in="0.3">VaLora: Two Watchers</div><div class="mid anim" data-in="0.9">A seated VR puzzle about sun, shade and privacy</div><div class="rule anim" data-in="1.3"></div><div class="small anim" data-in="1.5">Entry · Meta VR Start Developer Competition 2026</div></div></div>`},
  end: {cls: 'light', html: `<div class="center"><div><div class="big anim" data-in="0.1" style="font-size:72px">Play it now</div><div class="url anim" data-in="0.5">valora-vr.vercel.app</div><div class="end-grid"><div class="anim" data-in="0.9">18 levels · 6 countries · real sun path for each capital</div><div class="anim" data-in="1.2">Seated: point and pinch, or point and pull the trigger</div><div class="anim" data-in="1.5">Quest browser, or any computer with a mouse</div></div></div></div><div class="foot anim" data-in="1.9">Illustrative sunlight and visibility checks.</div>`},
};
// overlays: ?scene=ov&chip=..&label=..&cap=..&badge=..  or  ?scene=place&name=..&sub=..
if (scene === 'ov') {
  const chip = q.get('chip'), label = q.get('label'), cap = q.get('cap'), badge = q.get('badge');
  S.ov = {cls: 'overlay', html: `${chip ? `<div class="chip anim" data-in="0.15"><b>${chip}</b>${label || ''}</div>` : ''}${badge ? `<div class="badge anim" data-in="0.3">${badge}</div>` : ''}${cap ? `<div class="cap anim" data-in="0.45"${q.get('hi') ? ' style="bottom: 212px"' : ''}>${cap}</div>` : ''}`};
}
if (scene === 'place') S.place = {cls: 'overlay', html: `<div class="place anim" data-in="0.3">${q.get('name')}<small>${q.get('sub') || ''}</small></div>`};
const s = S[scene];
document.body.className = s.cls;
document.body.insertAdjacentHTML('beforeend', s.html);
const els = [...document.querySelectorAll('.anim')];
// critically damped spring-ish ease out with a hint of overshoot
const ease = (k) => (k >= 1 ? 1 : 1 - Math.pow(1 - k, 3) * (1 - 0.35 * Math.sin(k * Math.PI)));
function draw() {
  const t = performance.now() / 1000;
  for (const el of els) {
    const k = Math.max(0, Math.min(1, (t - +el.dataset.in) / 0.7));
    const e = ease(k);
    el.style.opacity = String(Math.min(1, k * 1.6));
    el.style.transform = `${el.classList.contains('cap') ? 'translateX(-50%) ' : ''}translateY(${(1 - e) * 22}px)`;
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
